sonar.projectKey=anchildress1_supascribe-notes-mcp
sonar.organization=anchildress1
sonar.sourceEncoding=UTF-8

sonar.sources=src
sonar.tests=tests
sonar.test.inclusions=tests/**/*.test.ts

# Business-logic coverage is enforced via Vitest (85% min) and mirrored here.
# Excluded files are transport/bootstrap/presentation plumbing without domain logic.
sonar.coverage.exclusions=src/index.ts,src/server.ts,src/lib/logger.ts,src/lib/openapi.ts,src/lib/shutdown.ts,src/lib/supabase.ts,src/middleware/request-logger.ts,src/tools/health.ts,src/views/**

sonar.javascript.lcov.reportPaths=coverage/lcov.info
